<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrackBuilder — 道路・線路の線形エディタ</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(18, 22, 27, 0.86);
        --border: rgba(255, 255, 255, 0.12);
        --text: #e8edf2;
        --muted: #97a3af;
        --accent: #5aa9e6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10141a;
        color: var(--text);
        font-family: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        font-size: 13px;
      }

      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .panel {
        position: absolute;
        top: 12px;
        width: 236px;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        padding: 12px 14px 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        backdrop-filter: blur(8px);
        pointer-events: auto;
      }

      .panel-left {
        left: 12px;
      }

      .panel-right {
        right: 12px;
        width: 260px;
      }

      .panel h2 {
        margin: 14px 0 7px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .panel h2:first-child {
        margin-top: 0;
      }

      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }

      button.chip {
        flex: 1 1 auto;
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        font: inherit;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease;
      }

      button.chip:hover {
        background: rgba(255, 255, 255, 0.11);
      }

      button.chip.active {
        background: rgba(90, 169, 230, 0.24);
        border-color: var(--accent);
      }

      button.chip.wide {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 5px;
      }

      button.chip.wide small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }

      /* 区画の用途チップ。色は 3D の区画表示と揃える。 */
      button.chip.zone-residential.active {
        background: rgba(92, 184, 102, 0.28);
        border-color: #5cb866;
      }

      button.chip.zone-commercial.active {
        background: rgba(82, 153, 235, 0.28);
        border-color: #5299eb;
      }

      button.chip.zone-industrial.active {
        background: rgba(235, 179, 77, 0.28);
        border-color: #ebb34d;
      }

      .elevation {
        flex: 1 1 auto;
        text-align: center;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }

      .text-input,
      .select-input {
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
        font: inherit;
      }

      .text-input {
        width: 100%;
      }

      .select-input {
        flex: 1 1 auto;
      }

      .station-editor {
        margin-top: 8px;
      }

      .station-editor .text-input {
        flex: 1 1 130px;
      }

      .hint {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 11px;
      }

      label.check {
        display: flex;
        gap: 7px;
        align-items: center;
        margin: 5px 0;
        cursor: pointer;
      }

      .readout .line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 3px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .readout .line span {
        color: var(--muted);
      }

      .readout .line b {
        font-variant-numeric: tabular-nums;
      }

      .readout .ok {
        color: #7fd1a0;
      }

      .readout .warn {
        color: #e8c135;
        display: block;
      }

      .readout .bad {
        color: #f0776b;
        display: block;
      }

      .warnings .line {
        line-height: 1.45;
      }

      /* 確認モードのグラフ。区間全体の曲率と勾配を 2 段の帯で見せる。 */
      .graph {
        display: block;
        width: 100%;
        height: 128px;
        margin: 8px 0 2px;
      }

      .graph .band {
        fill: rgba(255, 255, 255, 0.04);
      }

      .graph .zero {
        stroke: rgba(255, 255, 255, 0.22);
        stroke-width: 1;
      }

      .graph .limit {
        stroke: #f0776b;
        stroke-width: 1;
        stroke-dasharray: 3 3;
        opacity: 0.6;
      }

      .graph polyline {
        fill: none;
        stroke: #5aa9e6;
        stroke-width: 1.8;
        stroke-linejoin: round;
      }

      .graph .grad {
        stroke: #e8c135;
      }

      .graph .cursor {
        stroke: #fff;
        stroke-width: 1;
        opacity: 0.85;
      }

      .graph .tick {
        fill: var(--muted);
        font-size: 9px;
      }

      /* 敷設できないときの理由。一目で分かるように囲って強調する。 */
      .readout .blocked {
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid #f0776b;
        border-radius: 8px;
        background: rgba(240, 119, 107, 0.14);
        color: #ffb3aa;
        line-height: 1.5;
      }

      .readout .blocked b {
        display: block;
        margin-bottom: 4px;
        color: #f0776b;
      }

      .help {
        position: absolute;
        left: 12px;
        bottom: 12px;
        padding: 9px 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--muted);
        line-height: 1.6;
        pointer-events: auto;
      }

      .underground-badge {
        position: absolute;
        top: 14px;
        left: 50%;
        translate: -50% 0;
        padding: 7px 13px;
        border: 1px solid rgba(91, 216, 255, 0.65);
        border-radius: 999px;
        background: rgba(7, 31, 48, 0.88);
        color: #9be8ff;
        font-weight: 650;
        letter-spacing: 0.04em;
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity 0.16s ease, transform 0.16s ease;
      }

      body.underground-view .underground-badge {
        opacity: 1;
        transform: translateY(0);
      }

      .help b {
        color: var(--text);
      }

      /*
       * 乗車中は視界を空ける。左のパネルと操作の説明は敷設のためのもので、
       * 一人称視点では邪魔にしかならない。触れば戻る。
       */
      .riding .panel-left,
      .riding .help {
        opacity: 0.16;
        transition: opacity 0.15s ease;
      }

      .riding .panel-left:hover,
      .riding .help:hover {
        opacity: 1;
      }

      /* 乗る車両を選んでいる間は、指す操作だと分かるようにする。 */
      body.aiming #view {
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
