<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrackBuilder — 道路・線路の線形エディタ</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(18, 22, 27, 0.86);
        --border: rgba(255, 255, 255, 0.12);
        --text: #e8edf2;
        --muted: #97a3af;
        --accent: #5aa9e6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10141a;
        color: var(--text);
        font-family: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        font-size: 13px;
      }

      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .panel {
        position: absolute;
        top: 12px;
        width: 264px;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        padding: 12px 14px 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        backdrop-filter: blur(8px);
        pointer-events: auto;
      }

      .panel-left {
        left: 12px;
        /* 左下の操作の一覧に重ならない高さで止める。 */
        max-height: calc(100% - 68px);
      }

      .panel-right {
        right: 12px;
        width: 260px;
      }

      .panel h2 {
        margin: 14px 0 7px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .panel h2:first-child {
        margin-top: 0;
      }

      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }

      /*
       * ツールの並び。道路 / 鉄道 / 区画 / 撤去 / 確認 の 5 つを 1 行に揃える。
       * どれも 2 文字なので、押す所の大きさを一定にできる。
       */
      .row-tools {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
      }

      /* 鉄道の中身 (線路・駅・路線)。一段下げて、鉄道の内側だと分かるようにする。 */
      .row-subtools {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        margin: 5px 0 0 10px;
        padding-left: 8px;
        border-left: 2px solid var(--border);
      }

      .row-subtools[hidden] {
        display: none;
      }

      .row-tools button.chip,
      .row-subtools button.chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding: 7px 2px;
      }

      .row-tools button.chip small,
      .row-subtools button.chip small {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.06em;
      }

      .row-tools button.chip.active small,
      .row-subtools button.chip.active small {
        color: var(--text);
      }

      /* ツールごとの設定のまとまり。選んだツールのものだけが出る。 */
      .group {
        margin-top: 13px;
      }

      .group[hidden] {
        display: none;
      }

      /*
       * ツールに依らない設定 (表示・視点・マップ) の引き出し。
       * 畳んでおくと、いつも見えているのは「ツール + そのツールの設定」だけになる。
       */
      details.drawer {
        margin-top: 12px;
        border-top: 1px solid var(--border);
      }

      details.drawer > summary {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 0 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
        cursor: pointer;
      }

      details.drawer > summary::-webkit-details-marker {
        display: none;
      }

      details.drawer > summary::before {
        content: '▸';
        font-size: 10px;
        transition: rotate 0.12s ease;
      }

      details.drawer[open] > summary::before {
        rotate: 90deg;
      }

      details.drawer > summary:hover {
        color: var(--text);
      }

      button.chip {
        flex: 1 1 auto;
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        font: inherit;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease;
      }

      button.chip:hover {
        background: rgba(255, 255, 255, 0.11);
      }

      button.chip.active {
        background: rgba(90, 169, 230, 0.24);
        border-color: var(--accent);
      }

      /* 一覧に並べるチップ。名前と規格を 1 行に収めて縦を詰める。 */
      button.chip.wide {
        display: flex;
        width: 100%;
        gap: 4px 8px;
        /* 名前が長い種別だけ規格が下の行に落ちる。語の途中では折らない。 */
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        text-align: left;
        margin-bottom: 4px;
      }

      button.chip.wide > span {
        white-space: nowrap;
      }

      button.chip.wide small {
        flex: 0 0 auto;
        margin-left: auto;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }


      /* 区画の用途チップ。色は 3D の区画表示と揃える。 */
      button.chip.zone-residential.active {
        background: rgba(92, 184, 102, 0.28);
        border-color: #5cb866;
      }

      button.chip.zone-commercial.active {
        background: rgba(82, 153, 235, 0.28);
        border-color: #5299eb;
      }

      button.chip.zone-industrial.active {
        background: rgba(235, 179, 77, 0.28);
        border-color: #ebb34d;
      }

      .elevation {
        flex: 1 1 auto;
        text-align: center;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }

      .text-input,
      .select-input {
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
        font: inherit;
      }

      .text-input {
        width: 100%;
      }

      .select-input {
        flex: 1 1 auto;
      }

      .station-editor {
        margin-top: 8px;
      }

      .station-editor .text-input {
        flex: 1 1 130px;
      }

      .hint {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 11px;
      }

      /* 路線の一覧。色の見本・停車駅・状態を 1 行にまとめる。 */
      .line-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 6px;
      }

      .line-item {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        padding: 5px 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        cursor: pointer;
      }

      .line-item:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      .line-item.active {
        border-color: rgba(120, 200, 255, 0.75);
        background: rgba(120, 200, 255, 0.12);
      }

      .line-swatch {
        flex: 0 0 auto;
        width: 10px;
        height: 10px;
        margin-top: 3px;
        border-radius: 2px;
      }

      .line-text {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .line-text small {
        color: var(--muted);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .line-gap {
        color: #f0776b;
        font-size: 11px;
      }

      button.chip.line-remove {
        flex: 0 0 auto;
        padding: 2px 7px;
      }

      label.check {
        display: flex;
        gap: 7px;
        align-items: center;
        margin: 5px 0;
        cursor: pointer;
      }

      .readout .line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 3px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .readout .line span {
        color: var(--muted);
      }

      .readout .line b {
        font-variant-numeric: tabular-nums;
      }

      .readout .ok {
        color: #7fd1a0;
      }

      .readout .warn {
        color: #e8c135;
        display: block;
      }

      .readout .bad {
        color: #f0776b;
        display: block;
      }

      .warnings .line {
        line-height: 1.45;
      }

      /* 場所の分かる警告は押せる。押すとその場所へ視点が飛ぶ。 */
      .warnings button.line {
        appearance: none;
        display: block;
        width: 100%;
        margin: 0;
        padding: 3px 0;
        font: inherit;
        color: inherit;
        text-align: left;
        background: none;
        border: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        cursor: pointer;
      }

      .warnings button.line:hover,
      .warnings button.line:focus-visible {
        background: rgba(255, 255, 255, 0.08);
        text-decoration: underline;
      }

      /* 確認モードのグラフ。区間全体の曲率と勾配を 2 段の帯で見せる。 */
      .graph {
        display: block;
        width: 100%;
        height: 128px;
        margin: 8px 0 2px;
      }

      .graph .band {
        fill: rgba(255, 255, 255, 0.04);
      }

      .graph .zero {
        stroke: rgba(255, 255, 255, 0.22);
        stroke-width: 1;
      }

      .graph .limit {
        stroke: #f0776b;
        stroke-width: 1;
        stroke-dasharray: 3 3;
        opacity: 0.6;
      }

      .graph polyline {
        fill: none;
        stroke: #5aa9e6;
        stroke-width: 1.8;
        stroke-linejoin: round;
      }

      .graph .grad {
        stroke: #e8c135;
      }

      .graph .cursor {
        stroke: #fff;
        stroke-width: 1;
        opacity: 0.85;
      }

      .graph .tick {
        fill: var(--muted);
        font-size: 9px;
      }

      /* 敷設できないときの理由。一目で分かるように囲って強調する。 */
      .readout .blocked {
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid #f0776b;
        border-radius: 8px;
        background: rgba(240, 119, 107, 0.14);
        color: #ffb3aa;
        line-height: 1.5;
      }

      .readout .blocked b {
        display: block;
        margin-bottom: 4px;
        color: #f0776b;
      }

      /* 操作の一覧。畳めるようにして、要らないときは画面を空ける。 */
      .help {
        position: absolute;
        left: 12px;
        bottom: 12px;
        max-width: 460px;
        padding: 7px 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--muted);
        line-height: 1.6;
        pointer-events: auto;
      }

      .help > summary {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .help > summary::-webkit-details-marker {
        display: none;
      }

      .help > summary::before {
        content: '▸';
        font-size: 10px;
        transition: rotate 0.12s ease;
      }

      .help[open] > summary::before {
        rotate: 90deg;
      }

      .help > summary:hover {
        color: var(--text);
      }

      .help-body {
        margin-top: 6px;
      }

      .underground-badge {
        position: absolute;
        top: 14px;
        left: 50%;
        translate: -50% 0;
        padding: 7px 13px;
        border: 1px solid rgba(91, 216, 255, 0.65);
        border-radius: 999px;
        background: rgba(7, 31, 48, 0.88);
        color: #9be8ff;
        font-weight: 650;
        letter-spacing: 0.04em;
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity 0.16s ease, transform 0.16s ease;
      }

      body.underground-view .underground-badge {
        opacity: 1;
        transform: translateY(0);
      }

      .help b {
        color: var(--text);
      }

      /*
       * 乗車中は視界を空ける。左のパネルと操作の説明は敷設のためのもので、
       * 一人称視点では邪魔にしかならない。触れば戻る。
       */
      .riding .panel-left,
      .riding .help {
        opacity: 0.16;
        transition: opacity 0.15s ease;
      }

      .riding .panel-left:hover,
      .riding .help:hover {
        opacity: 1;
      }

      /* 乗る車両を選んでいる間は、指す操作だと分かるようにする。 */
      body.aiming #view {
        cursor: crosshair;
      }

      /*
       * 地形を作っている間の覆い。
       *
       * 20,480 m 四方の地形は、水系を解いて 4 m 格子へ細分するまでに数秒
       * かかる。その間ブラウザは止まるので、**先に描いてから**計算に入る。
       */
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0d1117;
        color: var(--text);
        font-size: 15px;
        letter-spacing: 0.08em;
        z-index: 50;
      }

      #loading[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <div id="loading">地形を生成しています…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
